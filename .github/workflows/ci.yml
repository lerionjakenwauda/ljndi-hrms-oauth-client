name: Package CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP source
        run: php -l src/HrmsOAuthClient.php

      - name: Verify autoloading
        run: php -r "require 'vendor/autoload.php'; new Ljndi\\HrmsOAuth\\HrmsOAuthClient('https://auth.example.com', 'client-id', 'https://app.example.com/callback'); echo 'autoload ok'.PHP_EOL;"
